<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noticias Dinámicas con Imágenes</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      padding: 20px;
    }

    /* 1. Contenedor principal para las 3 noticias */
    .contenedor-noticias {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap; /* Para que en pantallas pequeñas se pongan una debajo de otra */
    }

    /* 2. Estilos de la tarjeta individual */
    .tarjeta-noticia {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      width: 300px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between; /* Para empujar el botón al final */
    }

    /* Estilos de imagen */
    .imagen-tarjeta {
      width: 100%;
      height: 180px; /* Altura fija para que todas las tarjetas se vean iguales */
      object-fit: cover; /* Recorta la imagen sin deformarla para que quepa */
      border-radius: 5px;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    /*Botón de abrir */
    .btn-abrir {
      padding: 10px 15px;
      background-color: #0056b3;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-abrir:hover { background-color: #003d82; }

    dialog {
      width: 90%;
      max-width: 600px;
      padding: 25px;
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    dialog::backdrop {
      background-color: rgba(0, 0, 0, 0.7);
    }

    .modal-imagen {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .btn-cerrar {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #dc3545;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1 style="text-align: center;">Últimas Noticias</h1>

  <div class="contenedor-noticias">
    <div class="tarjeta-noticia">
      <h3>Sarampion sintomas</h3>
      <img src="img/sarampion.png" alt="Miniatura de noticia sobre la sarampion" class="imagen-tarjeta">
      <p>Un breve resumen de la primera noticia...</p>
      <button class="btn-abrir" data-id="1">Leer Noticia Sarampion</button>
    </div>

    <div class="tarjeta-noticia">
      <h3>Noticia 2</h3>
      <img src="img/tos ferina.png" alt="Miniatura de noticia 2" class="imagen-tarjeta">
      <p>Un breve resumen de la segunda noticia...</p>
      <button class="btn-abrir" data-id="2">Leer Noticia 2</button>
    </div>

    <div class="tarjeta-noticia">
      <h3>Noticia 3</h3>
      <img src="img/campaña contra dengue.png" alt="Miniatura de noticia 3" class="imagen-tarjeta">
      <p>Un breve resumen de la tercera noticia...</p>
      <button class="btn-abrir" data-id="3">Leer Noticia 3</button>
    </div>
  </div>

  <dialog id="modal-noticia">
    <h2 id="titulo-modal"></h2>
    <img id="imagen-modal" class="modal-imagen" src="" alt="Imagen grande de noticia">
    <p id="texto-modal"></p>
    
    <button class="btn-cerrar" id="btn-cerrar">Cerrar Noticia</button>
  </dialog>

  <script>
    const datosNoticias = {
      "1": {
        titulo: "Que es la Sarampion?",
        imagen: "img/sarampion.png", 
        contenido: "El sarampión es una enfermedad viral aguda y muy contagiosa que ha afectado a millones de personas en todo el mundo, especialmente a niños menores de cinco años. Es causada por el virus del sarampión, perteneciente a la familia Paramyxoviridae, y se transmite principalmente a través de pequeñas gotas expulsadas al hablar, toser o estornudar. Debido a su alta capacidad de contagio, una sola persona infectada puede transmitir la enfermedad rápidamente a quienes no están vacunados o no poseen inmunidad. Los primeros síntomas suelen aparecer entre 10 y 14 días después del contagio e incluyen fiebre alta, cansancio, tos seca, congestión nasal, dolor de garganta y ojos enrojecidos o sensibles a la luz. Posteriormente aparecen pequeñas manchas blancas dentro de la boca, conocidas como manchas de Koplik, y luego una erupción rojiza que inicia en el rostro y se extiende por todo el cuerpo.Aunque muchas personas logran recuperarse después de algunas semanas, el sarampión puede ocasionar complicaciones graves, sobre todo en niños pequeños, personas desnutridas o individuos con sistemas inmunológicos debilitados. Entre las complicaciones más frecuentes se encuentran la neumonía, infecciones del oído, diarrea severa, deshidratación e inflamación cerebral llamada encefalitis, que puede dejar secuelas permanentes o incluso causar la muerte. Antes de la creación de las vacunas, el sarampión provocaba epidemias frecuentes y era una de las principales causas de mortalidad infantil en diversos países. Gracias a los programas de vacunación, los casos disminuyeron considerablemente; sin embargo, en los últimos años han reaparecido brotes en algunas regiones debido a la disminución de la cobertura de vacunación y la desinformación sobre las vacunas.La prevención más efectiva contra el sarampión es la aplicación de la vacuna triple viral (SRP), que también protege contra las paperas y la rubéola. Esta vacuna es segura, eficaz y forma parte de los calendarios de vacunación en muchos países. Además de la vacunación, es importante mantener buenas medidas de higiene y evitar el contacto cercano con personas infectadas para reducir el riesgo de propagación. El sarampión sigue siendo un problema de salud pública en algunas partes del mundo, por lo que la educación y la prevención son fundamentales para proteger a la población y evitar nuevas epidemias."
        contenido: "El sarampión es una enfermedad viral aguda y muy contagiosa que ha afectado a millones de personas en todo el mundo especialmente a niños menores de cinco años."
      },
      "2": {
        titulo: "Campaña contra la tos ferina",
        imagen: "img/tos ferina.png", 
        contenido: "En las profundidades de la selva amazónica, biólogos han documentado una nueva especie de ave con un canto único y plumaje fluorescente bajo luz ultravioleta."
      },
      "3": {
        titulo: "Se realiza campaña en contra del dengue",
        imagen: "img/Campaña contra Dengue.png",
        contenido: "Un equipo de ingenieros logró mantener la estabilidad de un procesador cuántico a temperatura ambiente, marcando un hito histórico para la computación del futuro."
      }
    };

    // El resto del JavaScript se mantiene igual
    const modal = document.getElementById('modal-noticia');
    const tituloModal = document.getElementById('titulo-modal');
    const imagenModal = document.getElementById('imagen-modal');
    const textoModal = document.getElementById('texto-modal');
    const btnCerrar = document.getElementById('btn-cerrar');
    const botonesAbrir = document.querySelectorAll('.btn-abrir');

    botonesAbrir.forEach(boton => {
      boton.addEventListener('click', () => {
        const idNoticia = boton.getAttribute('data-id');
        const info = datosNoticias[idNoticia];

        // Rellenamos el modal con la información
        tituloModal.textContent = info.titulo;
        imagenModal.src = info.imagen; 
        textoModal.textContent = info.contenido;

        modal.showModal();
      });
    });

    btnCerrar.addEventListener('click', () => {
      modal.close();
    });
  </script>
</body>
</html>
