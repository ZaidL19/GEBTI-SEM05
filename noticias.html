<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noticias Dinámicas con Imágenes Locales</title>
  <style>
    /* ... (Todos los estilos CSS de antes se quedan igual) ... */
    body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
    .contenedor-noticias { display: flex; gap: 20px; justify-content: center; }
    .tarjeta-noticia { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 300px; text-align: center; }
    .btn-abrir { padding: 10px 15px; background-color: #0056b3; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    .btn-abrir:hover { background-color: #003d82; }
    dialog { width: 90%; max-width: 600px; padding: 25px; border: none; border-radius: 10px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); text-align: center; }
    dialog::backdrop { background-color: rgba(0, 0, 0, 0.7); }
    .modal-imagen { width: 100%; height: 300px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
    .btn-cerrar { margin-top: 20px; padding: 10px 20px; background-color: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>

  <h1 style="text-align: center;">Últimas Noticias (Locales)</h1>

  <div class="contenedor-noticias">
    <div class="tarjeta-noticia">
      <h3>Noticia 1</h3>
      <p>Un breve resumen...</p>
      <button class="btn-abrir" data-id="1">Leer Noticia 1</button>
    </div>
    </div>

  <dialog id="modal-noticia">
    <h2 id="titulo-modal"></h2>
    <img id="imagen-modal" class="modal-imagen" src="" alt="Imagen de noticia">
    <p id="texto-modal"></p>
    <button class="btn-cerrar" id="btn-cerrar">Cerrar Noticia</button>
  </dialog>

  <script>
    const datosNoticias = {
      "1": {
        titulo: "Mi Noticia Local 1",
        // 'img/' es la carpeta, 'noticia1.jpg' es tu archivo
        imagen: "img/sarampion.png", 
        contenido: "Este contenido se carga desde tu propia computadora. Asegúrate de que el nombre del archivo coincida exactamente (mayúsculas y minúsculas)."
      },
      "2": {
        titulo: "Noticia Local con PNG",
        imagen: "img/campaña contra dengue.png", // Asegúrate de la extensión correcta
        contenido: "Si tu imagen es .png, asegúrate de escribir .png aquí."
      },
      "3": {
        titulo: "Otra Noticia Local",
        imagen: "img/tos ferina.jpg",
        contenido: "Tercer ejemplo de contenido local."
      }
    };

    const modal = document.getElementById('modal-noticia');
    const tituloModal = document.getElementById('titulo-modal');
    const imagenModal = document.getElementById('imagen-modal');
    const textoModal = document.getElementById('texto-modal');
    const btnCerrar = document.getElementById('btn-cerrar');
    const botonesAbrir = document.querySelectorAll('.btn-abrir');

    botonesAbrir.forEach(boton => {
      boton.addEventListener('click', () => {
        const idNoticia = boton.getAttribute('data-id');
        const info = datosNoticias[idNoticia];

        tituloModal.textContent = info.titulo;
        imagenModal.src = info.imagen; // ¡Aquí inyectamos el camino local!
        textoModal.textContent = info.contenido;

        modal.showModal();
      });
    });

    btnCerrar.addEventListener('click', () => {
      modal.close();
    });
  </script>
</body>
</html>
