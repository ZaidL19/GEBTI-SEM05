<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noticias Dinámicas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      padding: 20px;
    }

    /* 1. Cuadrícula para las 3 noticias principales */
    .contenedor-noticias {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .tarjeta-noticia {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      width: 300px;
      text-align: center;
    }

    .btn-abrir {
      padding: 10px 15px;
      background-color: #0056b3;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-abrir:hover { background-color: #003d82; }

    /* 2. Estilos del Modal */
    dialog {
      width: 90%;
      max-width: 600px;
      padding: 25px;
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    dialog::backdrop {
      background-color: rgba(0, 0, 0, 0.7);
    }

    .modal-imagen {
      width: 100%;
      height: 300px;
      object-fit: cover; /* Ajusta la imagen sin deformarla */
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .btn-cerrar {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #dc3545;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1 style="text-align: center;">Últimas Noticias</h1>

  <div class="contenedor-noticias">
    <div class="tarjeta-noticia">
      <h3>Noticia 1</h3>
      <p>Un breve resumen de la primera noticia...</p>
      <button class="btn-abrir" data-id="1">Leer Noticia 1</button>
    </div>

    <div class="tarjeta-noticia">
      <h3>Noticia 2</h3>
      <p>Un breve resumen de la segunda noticia...</p>
      <button class="btn-abrir" data-id="2">Leer Noticia 2</button>
    </div>

    <div class="tarjeta-noticia">
      <h3>Noticia 3</h3>
      <p>Un breve resumen de la tercera noticia...</p>
      <button class="btn-abrir" data-id="3">Leer Noticia 3</button>
    </div>
  </div>

  <dialog id="modal-noticia">
    <h2 id="titulo-modal"></h2>
    <img id="imagen-modal" class="modal-imagen" src="" alt="Imagen de noticia">
    <p id="texto-modal"></p>
    
    <button class="btn-cerrar" id="btn-cerrar">Cerrar Noticia</button>
  </dialog>

  <script>
    // 1. Nuestra "Base de datos" de noticias
    const datosNoticias = {
      "1": {
        titulo: "El nuevo rover aterriza en Marte",
        imagen: "https://picsum.photos/id/1015/600/300", // Imagen de prueba
        contenido: "Hoy por la mañana, el nuevo vehículo de exploración tocó la superficie marciana enviando las primeras fotografías en alta resolución del cráter. La misión busca rastros de agua."
      },
      "2": {
        titulo: "Descubren nueva especie de ave",
        imagen: "https://picsum.photos/id/1024/600/300", // Imagen de prueba
        contenido: "En las profundidades de la selva amazónica, biólogos han documentado una nueva especie de ave con un canto único y plumaje fluorescente bajo luz ultravioleta."
      },
      "3": {
        titulo: "Avances en la tecnología cuántica",
        imagen: "https://picsum.photos/id/175/600/300", // Imagen de prueba
        contenido: "Un equipo de ingenieros logró mantener la estabilidad de un procesador cuántico a temperatura ambiente, marcando un hito histórico para la computación del futuro."
      }
    };

    // 2. Seleccionamos los elementos del HTML
    const modal = document.getElementById('modal-noticia');
    const tituloModal = document.getElementById('titulo-modal');
    const imagenModal = document.getElementById('imagen-modal');
    const textoModal = document.getElementById('texto-modal');
    const btnCerrar = document.getElementById('btn-cerrar');

    // Seleccionamos TODOS los botones que abren noticias
    const botonesAbrir = document.querySelectorAll('.btn-abrir');

    // 3. Le damos la orden a cada botón de abrir
    botonesAbrir.forEach(boton => {
      boton.addEventListener('click', () => {
        // Obtenemos el ID de la noticia que presionamos (1, 2 o 3)
        const idNoticia = boton.getAttribute('data-id');
        
        // Buscamos esa información en nuestros datos
        const info = datosNoticias[idNoticia];

        // Rellenamos el modal con la información correspondiente
        tituloModal.textContent = info.titulo;
        imagenModal.src = info.imagen;
        textoModal.textContent = info.contenido;

        // Finalmente, mostramos el modal
        modal.showModal();
      });
    });

    // 4. Función para cerrar el modal
    btnCerrar.addEventListener('click', () => {
      modal.close();
    });

  </script>
</body>
</html>
