<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Red de Salud Pacífico Norte</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

<div class="dashboard">

    <aside class="sidebar">
        <div class="perfil">
            <img src="img/index/logo.png" alt="Red de Salud Pacífico Norte">
            <h2>
                Red de Salud<br>
                Pacífico Norte
            </h2>
            <p>Administrador</p>
           
        </div>

        <ul>
            <li class="active">
                🏠 Inicio
            </li>
            <li onclick="goCRM()">
                👥 CRM Pacientes
            </li>
            <li>
                <a href="templates/ERP.html" style="color:inherit;text-decoration:none;">
                    📦 ERP Inventario
                </a>
            </li>
            <!-- <li>
                💊 Farmacia
            </li> 
            <li>
                📅 Citas Médicas
            </li>
            <li>
                📊 Reportes
            </li>
            <li>
                ⚙ Configuración
            </li> -->
        </ul>

        <div class="sidebar-footer">
            <button class="btnSalir" onclick="logout()">
                🚪 Cerrar Sesión
            </button>
        </div>
    </aside>

    <main class="contenido">
        <header>
            <h1>Dashboard General</h1>
            <input type="text" placeholder="Buscar paciente o producto">
        </header>

        <section class="cards">
            <div class="card-info">
                <h3>Pacientes</h3>
                <span id="clientesCount">0</span>
            </div>
            <div class="card-info">
                <h3>Productos</h3>
                <span id="productosCount">0</span>
            </div>
            <div class="card-info">
                <h3>Citas Hoy</h3>
                <span id="citasCount">25</span>
            </div>
            <div class="card-info">
                <h3>Personal</h3>
                <span id="personalCount">48</span>
            </div>
        </section>

        <section class="grafico">
            <h2>Estado General del Inventario ERP</h2>
            <div class="bars" id="graficoERP">
                <div id="barraOptimo" style="height:0%">
                    <span>Óptimo</span>
                </div>
                <div id="barraRegular" style="height:0%">
                    <span>Regular</span>
                </div>
                <div id="barraCritico" style="height:0%">
                    <span>Crítico</span>
                </div>
            </div>
        </section>

        <section class="bottom">
            <div class="inventario">
                <h2>Inventario Crítico ERP</h2>
                <ul id="inventarioCritico">

                </ul>
            </div>

            <div class="noticias">
                <h2>Noticias Internas</h2>
                <div id="noticiasERP">
                    <!-- Noticias se cargarán dinámicamente -->
                </div>
            </div>
        </section>
    </main>

</div>

<script>
// ====================
// SEGURIDAD
// ====================
if (localStorage.getItem("session") !== "active") {
    window.location.href = "login.html";
}

// ====================
// NAVEGACIÓN INTELIGENTE (Rutas locales vs Flask)
// ====================
function goCRM() {
    const isLocal = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost";
    
    if (isLocal) {
        
        window.location.href = "crm.html";
    } else {
        window.location.href = "templates/crm.html";
    }
}

function goERP() {
    window.location.href = "templates/ERP.html";
}

function logout() {
    if (confirm("¿Desea cerrar sesión?")) {
        localStorage.removeItem("session");
        window.location.href = "index.html";
    }
}

// ====================
// CONTROL DE DATOS Y RENDERIZADO
// ====================
const clientes = JSON.parse(localStorage.getItem("clientes")) || [];
const clientesElem = document.getElementById("clientesCount");
if (clientesElem) clientesElem.textContent = clientes.length;

const productos = JSON.parse(localStorage.getItem("productos")) || [];
const productosElem = document.getElementById("productosCount");
if (productosElem) productosElem.textContent = productos.length;

const citas = JSON.parse(localStorage.getItem("citas")) || [];
const citasElem = document.getElementById("citasCount");
if (citasElem && citas.length > 0) citasElem.textContent = citas.length;

const personal = JSON.parse(localStorage.getItem("personal")) || [];
const personalElem = document.getElementById("personalCount");
if (personalElem && personal.length > 0) personalElem.textContent = personal.length;

// ====================
// GENERACIÓN DE INVENTARIO CRÍTICO DINÁMICO
// ====================
const listaInventario = document.getElementById("inventarioCritico");

if (listaInventario) {
    const inventarioCritico = productos.filter(producto => Number(producto.stock) <= 10);

    if (inventarioCritico.length > 0) {
        listaInventario.innerHTML = "";
        inventarioCritico.forEach(producto => {
            const li = document.createElement("li");
            li.innerHTML = `${producto.nombre} - ${producto.stock} unidades`;
            listaInventario.appendChild(li);
        });
    }
}

</script>
<script>

function cargarDashboardERP() {

    let inventario =
        JSON.parse(
            localStorage.getItem("inventarioERP")
        ) || [];

    document.getElementById("productosCount")
        .innerText = inventario.length;

    let criticos = 0;
    let regulares = 0;
    let optimos = 0;

    let listaCriticos =
        document.getElementById(
            "inventarioCritico"
        );

    listaCriticos.innerHTML = "";

    inventario.forEach(item => {

        if (item.stock <= 100) {

            criticos++;

            listaCriticos.innerHTML += `
                <li>
                    ${item.nombre}
                    - ${item.stock} unidades
                </li>
            `;

        }
        else if (item.stock <= 500) {

            regulares++;

        }
        else {

            optimos++;

        }

    });

    let total = criticos + regulares + optimos;

    if (total > 0) {

        document.getElementById("barraCritico")
            .style.height =
            ((criticos / total) * 100) + "%";

        document.getElementById("barraRegular")
            .style.height =
            ((regulares / total) * 100) + "%";

        document.getElementById("barraOptimo")
            .style.height =
            ((optimos / total) * 100) + "%";

    }

    let noticiasDiv =
        document.getElementById("noticiasERP");

    noticiasDiv.innerHTML = "";

    inventario
        .slice(-5)
        .reverse()
        .forEach(item => {

            noticiasDiv.innerHTML += `
                <p>
                    📦 ${item.nombre}
                    | Stock: ${item.stock}
                    | Estado: ${item.estado}
                </p>
            `;

        });

}

window.onload = cargarDashboardERP;

</script>

</body>
</html>
