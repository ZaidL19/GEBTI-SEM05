<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login Sistema</title>
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

<div class="login-wrapper">

    <!-- PANEL IZQUIERDO -->
    <div class="left-panel">

        <div class="brand">
            <img src="img/Index/logo.png" alt="Logo">
            <div>
                <h1>Sistema de Gestión</h1>
                <h3>RED INTEGRADA DE SALUD PACÍFICO NORTE</h3>
            </div>
        </div>

        <div class="medical-image">
            <img src="img/login/doctor.png" alt="Personal Médico">
        </div>

        <p class="footer-text">
            Gestión eficiente y segura de la información en salud
        </p>

    </div>

    <!-- PANEL DERECHO -->
    <div class="right-panel">

        <div class="login-container">

            <h2>Acceso al Sistema</h2>

            <input type="text" id="user" placeholder="Usuario">

            <input type="password" id="pass" placeholder="Contraseña">

            <button onclick="login()">Ingresar</button>

            <button class="btn-register" onclick="register()">
                Registrarse
            </button>

            <div class="social-title">
                Síguenos:
            </div>

            <div class="socials">

                <a href="https://www.facebook.com/rispnorte" target="_blank">
                    <i class="fab fa-facebook-f"></i>
                </a>

               <a href="https://www.instagram.com/rispacificonorte/" target="_blank">
                    <i class="fab fa-instagram"></i>
                </a>
            </div>

        </div>

    </div>

</div>

<script>
/* =========================
   USUARIOS PREDEFINIDOS
========================= */
let users = [
    { user: "admin", pass: "1234", role: "admin" },

    { user: "rrhh", pass: "1234", role: "rrhh" },

    { user: "logistica", pass: "1234", role: "logistica" },

    { user: "director", pass: "1234", role: "director" },

    { user: "doctor", pass: "1234", role: "user" }
];

/* =========================
   CARGAR USUARIOS GUARDADOS
========================= */
const savedUsers = JSON.parse(localStorage.getItem("users")) || [];
users = users.concat(savedUsers);

/* =========================
   LOGIN
========================= */
function login(){
    const user = document.getElementById("user").value;
    const pass = document.getElementById("pass").value;

    const foundUser = users.find(u => u.user === user && u.pass === pass);

    if(foundUser){
        localStorage.setItem("session", "active");
        localStorage.setItem("role", foundUser.role);
        localStorage.setItem("currentUser", foundUser.user);

        window.location.href = "dashboard.html";
    } else {
        alert("Usuario o contraseña incorrectos");
    }
}

/* =========================
   REGISTRO
========================= */
function register(){
    const user = document.getElementById("user").value;
    const pass = document.getElementById("pass").value;

    if(!user || !pass){
        alert("Completa los campos");
        return;
    }

    const exists = users.find(u => u.user === user);

    if(exists){
        alert("El usuario ya existe");
        return;
    }

    const newUser = {
        user,
        pass,
        role: "user" // los nuevos siempre son usuarios normales
    };

    users.push(newUser);

    /* guardar SOLO los nuevos en localStorage */
    localStorage.setItem("users", JSON.stringify(
        users.filter(u =>
            u.user !== "admin" && u.user !== "doctor"
        )
    ));

    alert("Usuario registrado con éxito");
}
</script>

</body>
</html>
