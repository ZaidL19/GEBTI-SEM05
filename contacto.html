<!-- ======================================== -->

<section class="contacto" id="contacto">

    <div class="contenedor-contacto">

        <div class="info-contacto">

            <h2>Contáctanos</h2>

            <p>
                Estamos comprometidos con brindar atención y orientación
                a toda la comunidad de Pacífico Norte.
            </p>

            <div class="dato">
                <i class="fas fa-map-marker-alt"></i>
                <span>Chimbote - Perú</span>
            </div>

            <div class="dato">
                <i class="fas fa-phone"></i>
                <span>043-698402</span>
            </div>

            <div class="dato">
                <i class="fas fa-envelope"></i>
                <span>informes@redsalud.gob.pe</span>
            </div>

        </div>

        <!-- FORMULARIO -->
        <form class="form-contacto">

            <input 
                type="text"
                id="nombre"
                placeholder="Ingrese su nombre"
            >

            <input 
                type="email"
                id="correo"
                placeholder="Ingrese su correo"
            >

            <textarea 
                id="mensaje"
                placeholder="Escriba su mensaje"
            ></textarea>

            <button type="submit">
                Enviar Mensaje
            </button>

        </form>

    </div>

</section>
